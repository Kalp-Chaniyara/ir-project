# One place for every setting. Scripts read this file; change values here, not in code.

seed: 42

data:
  topics: dpr-nq-test          # Natural Questions open test set (3,610 questions), via Pyserini
  index: wikipedia-dpr-100w    # DPR Wikipedia, 21M passages of 100 words, prebuilt Pyserini index
  n_questions: 300             # questions sampled for the LLM experiments

models:
  llm: unsloth/Llama-3.2-3B-Instruct            # ungated copy of meta-llama/Llama-3.2-3B-Instruct
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2

retrieval:
  depth: 50       # BM25 candidates kept per question (the reranker re-orders these)
  k: 5            # passages given to the LLM (same as the paper)
  threads: 8

query2doc:
  repeat_query: 5        # Query2Doc: the question is repeated 5 times before the pseudo-passage
  max_new_tokens: 128

llm:
  dtype: float16
  passage_max_new_tokens: 24   # short answer from a single passage
  rag_max_new_tokens: 32       # final RAG answer

metrics:
  gamma: 0.3333333333              # UDCG weight for irrelevant passages (paper uses 1/3)
  hard_distractor_threshold: 0.8   # DE above this = hard distractor (Amiraz et al. 2025)

repro:
  udcg_data_url: https://raw.githubusercontent.com/GiovanniTRA/UDCG/main/data/datasets/nq_dataset.json
  n_questions: 200            # questions used to reproduce the paper's correlation experiment
  contexts_per_question: 10   # 5 contexts with a relevant passage + 5 without (as in the paper)
  context_size: 5
  pnr_check_questions: 40     # questions whose 25 passages we re-score to check our P_nr matches the paper's
  paper_model_key: meta-llama/Llama-3.2-3B-Instruct

paper_table3_llama3b_nq:      # Spearman correlations reported in the paper (Table 3, Llama 3B, NQ)
  nDCG: 0.458
  MRR: 0.452
  Precision: 0.482
  Hits: 0.411
  UDCG: 0.536
